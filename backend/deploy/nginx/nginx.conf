upstream ingest    { server ingest:8080; }
upstream analytics { server analytics:8081; }
upstream auth      { server auth:8082; }

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # Общие CORS для всех API
    set $cors_origin "*";
    set $cors_methods "GET, POST, PUT, DELETE, OPTIONS";
    set $cors_headers "Authorization, Content-Type";

    location /api/v1/auth/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://auth;
    }

    location /api/v1/admin/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://auth;
    }

    location = /api/v1/categories {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://auth;
    }

    location = /api/v1/messages {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://ingest;
    }

    location ^~ /api/v1/messages/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://analytics;
    }

    location = /api/v1/search {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://analytics;
    }

    location /api/v1/stats/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods $cors_methods;
            add_header Access-Control-Allow-Headers $cors_headers;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        proxy_pass http://analytics;
    }

    location / {
        default_type text/plain;
        return 200 "Diplom API gateway. Frontend is deployed separately. API is under /api/v1/\n";
    }
}