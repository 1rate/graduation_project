services:
  # ─── Инфраструктура ───────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: diplom-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: diplom-postgres
    environment:
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom
      POSTGRES_DB: diplom
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplom -d diplom"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: diplom-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: diplom
      MINIO_ROOT_PASSWORD: diplomdiplom
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: diplom-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -E ''"status":"(yellow|green)"'' >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: diplom-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: diplom-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: diplom-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ─── Bootstrap (одноразовые контейнеры) ───────────────────────────────
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: diplom-migrate
    volumes:
      - ./migrations:/migrations:ro
    command: -path=/migrations -database "postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Go-сервисы ────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: auth
    container_name: diplom-auth
    environment:
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      AUTH_HTTP_ADDR: ":8082"
      AUTH_TOKEN_TTL: 24h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: ingest
    container_name: diplom-ingest
    environment:
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: diplom
      MINIO_SECRET_KEY: diplomdiplom
      MINIO_BUCKET: diplom-audio
      MINIO_USE_SSL: "false"
      INGEST_HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: indexer
    container_name: diplom-indexer
    environment:
      NATS_URL: nats://nats:4222
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: messages
      LOG_LEVEL: info
    depends_on:
      nats: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: analytics
    container_name: diplom-analytics
    environment:
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: messages
      ANALYTICS_HTTP_ADDR: ":8081"
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000 # для presigned URL: хост, по которому MinIO виден браузеру
      MINIO_ACCESS_KEY: diplom
      MINIO_SECRET_KEY: diplomdiplom
      MINIO_BUCKET: diplom-audio
      MINIO_USE_SSL: "false"
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── Python-сервисы (ML / STT) ─────────────────────────────────────────
  stt:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE: stt
        INSTALL_FFMPEG: "1"
    container_name: diplom-stt
    environment:
      NATS_URL: nats://nats:4222
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: diplom
      MINIO_SECRET_KEY: diplomdiplom
      MINIO_BUCKET: diplom-audio
      MINIO_USE_SSL: "false"
      # Whisper params (faster-whisper). small=480MB, medium=1.5GB, large-v3=3GB.
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu # cpu | cuda (для GPU нужен nvidia-container-toolkit)
      WHISPER_COMPUTE: int8 # int8 | float16 (float16 только на GPU)
      WHISPER_LANGUAGE: ru
      LOG_LEVEL: INFO
    volumes:
      - whisper-cache:/root/.cache/huggingface
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  sentiment:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE: sentiment
    container_name: diplom-sentiment
    environment:
      NATS_URL: nats://nats:4222
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      MODEL_DIR: /app/model
      LOG_LEVEL: INFO
    volumes:
      - ./test_models/model:/app/model
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  category:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE: category
    container_name: diplom-category
    environment:
      NATS_URL: nats://nats:4222
      POSTGRES_DSN: postgres://diplom:diplom@postgres:5432/diplom?sslmode=disable
      MODEL_DIR: /app/model
      CATEGORY_MIN_SCORE: "0.5"
      LOG_LEVEL: INFO
    volumes:
      - ./data/category/rubert_tiny2_onnx:/app/model:ro
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── Шлюз ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: diplom-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ingest
      - analytics
      - auth
    restart: unless-stopped

volumes:
  nats-data:
  pg-data:
  minio-data:
  es-data:
  prometheus-data:
  grafana-data:
  whisper-cache:
